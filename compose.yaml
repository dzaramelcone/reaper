services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "max_connections=1100"]
    environment:
      POSTGRES_DB: reaper
      POSTGRES_PASSWORD: reaper
      POSTGRES_USER: reaper
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./reaper/schema.sql:/docker-entrypoint-initdb.d/001-reaper.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reaper -d reaper"]
      interval: 1s
      timeout: 3s
      retries: 30
